name: Arcade Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PACMAN
      - name: Generate Pacman
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: nitin4568
          game: pacman

      # GALAGA
      - name: Generate Galaga
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: nitin4568
          game: galaga

      # BOMBERMAN
      - name: Generate Bomberman
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: nitin4568
          game: bomberman

      - name: List dist files
        run: ls -R dist

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
