name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: nitin4568

          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff00ff&color_dots=#0d1117,#161b22,#21262d,#30363d,#484f58

            dist/github-snake.svg?palette=github-dark&color_snake=#ff00ff&color_dots=#0d1117,#161b22,#21262d,#30363d,#484f58

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
